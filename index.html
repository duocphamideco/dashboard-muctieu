<script>
(function(){
  'use strict';
  if (window.__IDECO_HUYEN_LIVE_WIDGET_V5_LOADED__) return;
  window.__IDECO_HUYEN_LIVE_WIDGET_V5_LOADED__ = true;
  window.__IDECO_HUYEN_LIVE_WIDGET_V4_LOADED__ = true;
  window.__IDECO_HUYEN_LIVE_WIDGET_V3_LOADED__ = true;
  window.__IDECO_HUYEN_LIVE_WIDGET_V2_LOADED__ = true;
  window.__IDECO_HUYEN_LIVE_WIDGET_LOADED__ = true;

  /* HUYỀN LIVE V5 — BROADCAST + KHỬ TRÙNG THEO NHÂN VIÊN/KHÁCH HÀNG
     - KHÔNG cần biết tên người đang mở website.
     - Nhận kênh mới huyenLiveBroadcast/current.
     - Tương thích ngược: nếu app gửi cũ chỉ ghi huyenLive/<staffKey>/<id>,
       widget tự quét và lấy bản Live mới nhất.
     - Shadow DOM + REST Firebase: không đụng ID/CSS/Firebase app của website chủ.
     - Mỗi trình duyệt tự ghi nhớ "Đã hiểu"; người vào sau/máy khác vẫn nhận.
  */
  var CFG = Object.assign({
    firebaseUrl: 'https://chamsockh-a1bb7-default-rtdb.firebaseio.com',
    pollMs: 10000,
    firstDelayMs: 1200,
    maxAgeMs: 7 * 24 * 60 * 60 * 1000,
    debug: false
  }, window.IDECO_HUYEN_LIVE_CONFIG || {});

  var SEEN_KEY = 'ideco_huyen_live_seen_v5';
  var CASE_ACK_KEY = 'ideco_huyen_live_case_ack_v5';
  var DEVICE_KEY = 'ideco_huyen_live_device_v5';
  var current = null, checking = false, lastStatus = {loaded:true,lastCheckAt:0,lastError:'',candidateCount:0,popupOpen:false,source:''};

  function log(){ if(!CFG.debug || !window.console) return; try{ console.log.apply(console,['[HUYEN LIVE V4]'].concat([].slice.call(arguments))); }catch(e){} }
  function base(){ return String(CFG.firebaseUrl||'').replace(/\/+$/,''); }
  function url(path){ return base()+'/'+String(path||'').replace(/^\/+/, '')+'.json'; }
  async function read(path){
    var r = await fetch(url(path)+'?_='+Date.now(), {cache:'no-store', mode:'cors'});
    if(!r.ok) throw new Error('Firebase HTTP '+r.status+' @ '+path);
    return await r.json();
  }
  async function patch(path, body){
    var r = await fetch(url(path), {method:'PATCH', mode:'cors', cache:'no-store', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if(!r.ok) throw new Error('Firebase HTTP '+r.status+' @ '+path);
    return true;
  }
  function safeObj(raw){
    try{ var x=JSON.parse(raw||'{}'); return x&&typeof x==='object'&&!Array.isArray(x)?x:{}; }catch(e){return {};}
  }
  function seenMap(){ try{return safeObj(localStorage.getItem(SEEN_KEY));}catch(e){return {};} }
  function hasSeen(id){ if(!id) return false; var s=seenMap(); return !!s[id]; }
  function markSeen(id){
    if(!id) return;
    try{
      var s=seenMap(), now=Date.now(); s[id]=now;
      var arr=Object.keys(s).sort(function(a,b){return Number(s[b]||0)-Number(s[a]||0);});
      var keep={}; arr.slice(0,80).forEach(function(k){keep[k]=s[k];});
      localStorage.setItem(SEEN_KEY,JSON.stringify(keep));
    }catch(e){}
  }
  function foldText(v){
    return String(v||'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
  }
  function shortHash(v){
    v=String(v||''); var h=2166136261;
    for(var i=0;i<v.length;i++){ h^=v.charCodeAt(i); h=Math.imul(h,16777619); }
    return (h>>>0).toString(36);
  }
  function caseKeyOf(m){
    if(m && m.caseKey) return String(m.caseKey);
    var staff=foldText(m&&m.staffName||'');
    var custId=String(m&&m.customerId||'').trim();
    var cust=foldText(m&&m.customerName||'');
    var raw=staff+'|'+(custId ? 'id:'+custId : 'name:'+cust);
    return 'case_'+shortHash(raw)+'_'+shortHash(staff).slice(0,5)+'_'+shortHash(custId||cust).slice(0,5);
  }
  function caseAckMap(){ try{return safeObj(localStorage.getItem(CASE_ACK_KEY));}catch(e){return {};} }
  function caseAckAt(caseKey){ if(!caseKey) return 0; var x=caseAckMap(); return Number(x[caseKey]||0); }
  function markCaseAck(caseKey, at){
    if(!caseKey) return;
    try{
      var x=caseAckMap(), now=Number(at||Date.now()); x[caseKey]=Math.max(Number(x[caseKey]||0),now);
      var arr=Object.keys(x).sort(function(a,b){return Number(x[b]||0)-Number(x[a]||0);});
      var keep={}; arr.slice(0,120).forEach(function(k){keep[k]=x[k];});
      localStorage.setItem(CASE_ACK_KEY,JSON.stringify(keep));
    }catch(e){}
  }
  function deviceId(){
    try{
      var d=localStorage.getItem(DEVICE_KEY); if(d) return d;
      d='dv_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9); localStorage.setItem(DEVICE_KEY,d); return d;
    }catch(e){ return 'dv_'+Math.random().toString(36).slice(2,9); }
  }
  function asMsg(x, fallbackId, source){
    if(!x || typeof x!=='object') return null;
    var id=String(x.id||x.broadcastId||fallbackId||'').trim();
    if(!id) return null;
    return {
      id:id,
      staffName:String(x.staffName||''),
      staffKey:String(x.staffKey||''),
      customerId:String(x.customerId||''),
      customerName:String(x.customerName||''),
      caseKey:String(x.caseKey||''),
      title:String(x.title||''),
      content:String(x.content||''),
      mode:String(x.mode||''),
      createdAt:Number(x.createdAt||x.publishedAt||x.ts||0),
      source:source||String(x.source||'')
    };
  }
  function flattenLegacy(root){
    var out=[];
    if(!root || typeof root!=='object') return out;
    Object.keys(root).forEach(function(staffKey){
      var box=root[staffKey]; if(!box || typeof box!=='object') return;
      Object.keys(box).forEach(function(id){ var m=asMsg(box[id],id,'legacy:huyenLive/'+staffKey); if(m) out.push(m); });
    });
    return out;
  }
  function validCandidate(m){
    if(!m || !m.id || !m.content) return false;
    if(hasSeen(m.id)) return false;
    var ck=caseKeyOf(m), ack=caseAckAt(ck);
    /* Đã hiểu một KH -> bỏ toàn bộ bản Live cũ/trùng của đúng NV + KH đó.
       Live mới phát SAU thời điểm Đã hiểu vẫn được phép hiện lại. */
    if(ack && (!m.createdAt || Number(m.createdAt)<=ack)) return false;
    if(m.createdAt && CFG.maxAgeMs>0 && (Date.now()-m.createdAt)>CFG.maxAgeMs) return false;
    return true;
  }

  /* Shadow DOM UI */
  try{ document.querySelectorAll('[data-ideco-huyen-live-host],[data-ideco-huyen-live-host-v2],[data-ideco-huyen-live-host-v3],[data-ideco-huyen-live-host-v4],[data-ideco-huyen-live-host-v5]').forEach(function(x){x.remove();}); }catch(e){}
  var host=document.createElement('div'); host.setAttribute('data-ideco-huyen-live-host-v5','1'); host.style.cssText='all:initial;position:relative;z-index:2147483647';
  (document.documentElement||document.body).appendChild(host);
  var shadow=host.attachShadow?host.attachShadow({mode:'open'}):host;
  var st=document.createElement('style');
  st.textContent=':host{all:initial}*,*::before,*::after{box-sizing:border-box}.ov{position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(8,20,38,.76);backdrop-filter:blur(4px);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.ov.on{display:flex}.card{width:min(920px,96vw);max-height:93vh;display:flex;flex-direction:column;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 28px 90px rgba(0,0,0,.44);border:2px solid #f2cf77;color:#0b2545}.hd{padding:20px 22px;background:linear-gradient(100deg,#fff8e7,#fff,#eef7ff);border-bottom:1px solid #e3e8f2}.tag{font-size:11px;font-weight:900;letter-spacing:.12em;color:#d07a00;text-transform:uppercase;margin-bottom:7px}.ttl{font-size:clamp(17px,2.5vw,22px);line-height:1.42;font-weight:900;margin:0}.cust{font-size:13px;color:#1d6fd0;font-weight:800;margin-top:8px}.body{padding:20px 22px;overflow:auto;white-space:pre-wrap;font-size:14px;line-height:1.72;color:#334155;font-weight:500}.ft{padding:15px 20px 18px;background:#f4f6fb;border-top:1px solid #e3e8f2}.err{display:none;color:#d8324b;font-size:12px;font-weight:800;text-align:center;margin:0 0 9px}.err.on{display:block}.btn{appearance:none;border:0;width:100%;min-height:52px;border-radius:14px;background:#0b2545;color:#fff;font-size:14px;font-weight:900;letter-spacing:.05em;cursor:pointer;box-shadow:0 10px 24px rgba(11,37,69,.22)}.note{text-align:center;font-size:10.5px;color:#94a3b8;margin-top:8px;font-weight:600}';
  shadow.appendChild(st);
  var ov=document.createElement('div'); ov.className='ov';
  var card=document.createElement('div'); card.className='card';
  var hd=document.createElement('div'); hd.className='hd';
  var tag=document.createElement('div'); tag.className='tag'; tag.textContent='HUYỀN LIVE · THÔNG BÁO TỪ BGĐ';
  var ttl=document.createElement('h2'); ttl.className='ttl';
  var cust=document.createElement('div'); cust.className='cust';
  var bd=document.createElement('div'); bd.className='body';
  var ft=document.createElement('div'); ft.className='ft';
  var er=document.createElement('p'); er.className='err';
  var btn=document.createElement('button'); btn.type='button'; btn.className='btn'; btn.textContent='Đã hiểu';
  var note=document.createElement('div'); note.className='note'; note.textContent='Bấm “Đã hiểu” một lần sẽ đóng toàn bộ bản trùng/cũ của đúng nhân viên + khách hàng này; chỉ chuyển sang khách hàng khác.';
  hd.appendChild(tag); hd.appendChild(ttl); hd.appendChild(cust); ft.appendChild(er); ft.appendChild(btn); ft.appendChild(note); card.appendChild(hd); card.appendChild(bd); card.appendChild(ft); ov.appendChild(card); shadow.appendChild(ov);

  function show(m){
    current=m;
    ttl.textContent=m.title || ('Bạn '+(m.staffName||'')+', Huyền được phân công BGĐ gởi bạn phần nội dung gợi ý xử lý về khách hàng mới mà bạn đang giao dịch, bạn xem lại và tìm cách chốt:');
    cust.textContent=m.customerName?('Khách hàng: '+m.customerName):'';
    bd.textContent=m.content||''; er.textContent=''; er.classList.remove('on'); btn.disabled=false; btn.textContent='Đã hiểu'; ov.classList.add('on');
    lastStatus.popupOpen=true; lastStatus.source=m.source||'';
  }
  function hide(){ current=null; ov.classList.remove('on'); lastStatus.popupOpen=false; }

  async function fetchCandidates(){
    var all=[];
    try{
      var g=await read('huyenLiveBroadcast/current');
      var gm=asMsg(g,g&&g.id,'global:huyenLiveBroadcast/current'); if(gm) all.push(gm);
    }catch(e){ log('global read lỗi',e); }
    /* Tương thích bản gửi cũ: quét toàn bộ hộp thư theo nhân viên, không cần biết người đang mở Tổng là ai. */
    try{
      var legacy=await read('huyenLive'); all=all.concat(flattenLegacy(legacy));
    }catch(e){ log('legacy read lỗi',e); }
    /* Khử trùng theo CA GIAO DỊCH, không chỉ theo id:
       cùng NV + cùng KH chỉ giữ bản mới nhất. */
    var uniqCase={}, out=[];
    all.forEach(function(m){
      if(!m||!m.id)return;
      var ck=caseKeyOf(m); m.caseKey=ck;
      if(!uniqCase[ck] || Number(m.createdAt||0)>Number(uniqCase[ck].createdAt||0)) uniqCase[ck]=m;
    });
    Object.keys(uniqCase).forEach(function(k){if(validCandidate(uniqCase[k]))out.push(uniqCase[k]);});
    out.sort(function(a,b){return Number(b.createdAt||0)-Number(a.createdAt||0);});
    return out;
  }
  async function check(force){
    if(checking || (current && !force)) return;
    checking=true;
    try{
      var arr=await fetchCandidates();
      if(current && !validCandidate(current)) hide();
      lastStatus={loaded:true,lastCheckAt:Date.now(),lastError:'',candidateCount:arr.length,popupOpen:!!current,source:arr[0]?arr[0].source:''};
      if(arr.length && !current) show(arr[0]);
    }catch(e){
      lastStatus={loaded:true,lastCheckAt:Date.now(),lastError:String(e&&e.message||e||e),candidateCount:0,popupOpen:!!current,source:''};
      log('check lỗi',lastStatus);
    }finally{checking=false;}
  }

  btn.addEventListener('click',function(){
    if(!current) return;
    var m=current, id=m.id, ck=caseKeyOf(m), ackAt=Date.now();
    /* Một lần Đã hiểu = đóng toàn bộ bản trùng/cũ của đúng NV + KH này trên máy này. */
    markSeen(id); markCaseAck(ck,ackAt); hide();
    var did=deviceId();
    patch('huyenLiveBroadcast/acks/'+id+'/'+did,{acknowledgedAt:ackAt,caseKey:ck,staffName:m.staffName||'',customerId:m.customerId||'',customerName:m.customerName||'',ua:String(navigator.userAgent||'').slice(0,160)}).catch(function(e){log('ack cloud lỗi',e);});
    patch('huyenLiveBroadcast/caseAcks/'+encodeURIComponent(ck)+'/'+did,{acknowledgedAt:ackAt,lastLiveId:id,staffName:m.staffName||'',customerId:m.customerId||'',customerName:m.customerName||''}).catch(function(e){log('case ack cloud lỗi',e);});
    /* Sau khi đóng, chỉ xét khách hàng KHÁC hoặc Live mới hơn ackAt. */
    setTimeout(function(){check(true);},250);
  });

  function wake(){ setTimeout(function(){check(true);},100); }
  try{ window.addEventListener('ideco:huyen-live-published',wake); window.addEventListener('storage',function(e){ if(e&&(e.key===SEEN_KEY||e.key===CASE_ACK_KEY)) wake(); }); }catch(e){}
  window.IDECO_HUYEN_LIVE_CHECK_NOW=function(){return check(true);};
  window.IDECO_HUYEN_LIVE_DEBUG=function(){return Object.assign({},lastStatus,{firebaseUrl:base(),seenIds:Object.keys(seenMap()).slice(-20),currentId:current&&current.id||'',caseAckCount:Object.keys(caseAckMap()).length,currentCaseKey:current?caseKeyOf(current):'',version:'V5-CASE-DEDUPE'});};

  setTimeout(function(){check(true);},Math.max(200,Number(CFG.firstDelayMs)||1200));
  setInterval(function(){check(false);},Math.max(5000,Number(CFG.pollMs)||10000));
})();
</script>
